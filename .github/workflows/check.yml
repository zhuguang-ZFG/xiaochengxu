name: repo-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行仓库一致性校验（链接/元数据/序号/孤儿资产/GIF与视频体积/代码块语言/交叉引用）
        run: python tools/check_repo.py

      - name: 校验器自测（防止校验静默失效）
        run: python tools/test_check_repo.py

      - name: 资产新鲜度检查的自测（守护「以 HEAD 为基准」这一属性）
        run: python tools/test_assets_fresh.py

      - name: Mermaid 标记解析自测（未标记块/重复资产/路径越界必须报错）
        run: python tools/test_mermaid_source.py

      - name: 安装 Pillow、编码器与 CJK 字体（折行要按真实字体度量像素宽度，
          原子落盘自测要真的跑一遍 ffmpeg 合成）
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install pillow==12.3.0 imageio-ffmpeg==0.6.0

      - name: 视频字幕折行自测（不许把标识符劈成两截、不许出现孤行）
        run: python tools/test_gen_videos.py

      - name: Mermaid 渲染命令自测（锁定版本、路径必须落在 assets 下、配置固定）
        run: python tools/test_gen_mermaid.py

      - name: 电子书导出层自测（真打 EPUB 校验结构与链接；PDF 成品需 Edge + PyMuPDF，CI 自动跳过）
        run: |
          pip install markdown==3.11
          python tools/test_export_book.py

      - name: 变异测试（确认自测真的能抓到缺陷，而非碰巧全绿）
        run: python tools/test_mutations.py

      - name: 示例工程 JS 语法校验
        run: |
          set -e
          for f in $(find examples -name "*.js"); do
            node --check "$f"
          done
          echo "JS 语法全部通过"

      - name: 示例工程单元测试
        run: |
          node --test "examples/todo-miniprogram/tests/*.test.js"
          node --test "examples/navigation-miniprogram/tests/*.test.js"
          node --test "examples/product-list-miniprogram/tests/*.test.js"

  assets:
    # 必须跑在 windows 上：render.py 按平台选中文（Windows 微软雅黑 / macOS 苹方 /
    # Linux Noto CJK），同一份脚本在 Linux 上渲染出的像素与已提交资产完全不同，
    # 比对必然失败。这不是能靠改脚本绕开的差异，只能用同一字体环境。
    runs-on: windows-latest
    env:
      # 浏览器由 npm 脚本按固定版本安装；禁止 Puppeteer 在 npm install
      # 阶段再下一份版本不明的 Chromium。
      PUPPETEER_SKIP_DOWNLOAD: "1"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/mermaid/package-lock.json

      - name: 缓存 Chrome for Testing（版本与 npm 安装脚本一致）
        uses: actions/cache@v4
        with:
          path: tools/mermaid/.browser
          key: mermaid-browser-${{ runner.os }}-157.0.8103.78

      - name: 安装生成依赖（锁定版本——资产就是这套工具链生成的）
        run: |
          pip install pillow==12.3.0 imageio-ffmpeg==0.6.0
          npm ci --ignore-scripts --prefix tools/mermaid
          npm run install-browser --prefix tools/mermaid

      - name: 重跑生成脚本，确认已提交的资产就是脚本输出
        run: python tools/check_assets_fresh.py
