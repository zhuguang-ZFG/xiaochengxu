<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>链路速率与时延</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/network.js"></script>
<script src="audio/zh/timings.js"></script>
<script>
'use strict';

const CHAPTER = { number: 1, title: '链路速率与时延', minutes: 4, language: 'zh', next: '../ch02/' };
const PROP_COLOR = '#247ba0';

const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font } = {}) => {
  const e = T(p, str, { x, y, size, fill, anchor, weight, font, o: 0 });
  show(e, t0);
  return e;
};

function rateTask(diagram, target, why, wrong) {
  return (body, api) => {
    diagram.live(true);
    diagram.focus();
    body.append(h('p', 'state-note', '调整时看读数：橙色发送段会变，蓝色传播段仍为 10 ms。'));
    return {
      check() {
        const ok = Math.abs(diagram.v.rate - target) < 1e-9;
        api.grade(ok, ok ? why : wrong(diagram.v.rate));
      },
      reveal() {
        diagram.set({ rate: target });
        return why;
      },
      lock() { diagram.live(false); },
      hint: ['← / → 调整速率', 'Enter 检查'],
      key(event) {
        if (event.shiftKey && ['ArrowRight', 'ArrowUp', 'ArrowLeft', 'ArrowDown'].includes(event.key)) return false;
        const changes = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 10, PageDown: -10 };
        if (event.key === 'Home') diagram.set({ rate: 1 });
        else if (event.key === 'End') diagram.set({ rate: 100 });
        else if (changes[event.key]) diagram.nudge(changes[event.key]);
        else return false;
        diagram.focus();
        return true;
      },
    };
  };
}

function playgroundAsk(diagram, done) {
  const c = card(BAND, 'quiz playground');
  const head = h('div', 'head', [
    h('p', 'kicker', '动手试'),
    h('p', 'prompt', '拖动速率滑块，观察两段时间怎样变化。'),
  ]);
  const body = h('div', 'body', [h('p', 'state-note', '速率越高，发送段越短；蓝色传播段不动，总时延越接近 10 ms。')]);
  const next = h('button', 'btn go', ['继续', kbd('Enter')]);
  const acts = h('div', 'acts', [next]);
  c.append(mascotEl(108), head, h('div', 'fb'), body, acts);
  diagram.live(true);
  diagram.focus();
  next.onclick = () => {
    diagram.live(false);
    c.remove();
    done();
  };
  P.keys = event => {
    if (event.key === 'Enter') { next.click(); return true; }
    if (event.shiftKey && ['ArrowRight', 'ArrowUp', 'ArrowLeft', 'ArrowDown'].includes(event.key)) return false;
    const changes = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 10, PageDown: -10 };
    if (event.key === 'Home') diagram.set({ rate: 1 });
    else if (event.key === 'End') diagram.set({ rate: 100 });
    else if (changes[event.key]) diagram.nudge(changes[event.key]);
    else return false;
    diagram.focus();
    return true;
  };
  P.cleanup.push(() => { diagram.live(false); c.remove(); });
}

const BEATS = [
  ['intro', '一个问题', (m, D) => {
    const p = panel(0);
    const g = G(p, { o: 0, y: 18 });
    T(g, '第一章', { x: 800, y: 220, size: 30, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, '链路速率与时延', { x: 800, y: 330, size: 76, fill: COL.chalk, anchor: 'middle', weight: 700 });
    tw(g, { o: 1, y: 0 }, .2, 1, out);
    mk('line', { x1: 300, y1: 500, x2: 1300, y2: 500, stroke: COL.chalk, 'stroke-width': 5, 'stroke-linecap': 'round' }, p);
    mk('rect', { x: 250, y: 450, width: 120, height: 100, rx: 18, fill: COL.panel, stroke: COL.chalk, 'stroke-width': 3 }, p);
    mk('rect', { x: 1230, y: 450, width: 120, height: 100, rx: 18, fill: COL.panel, stroke: COL.chalk, 'stroke-width': 3 }, p);
    T(p, '发送', { x: 310, y: 510, size: 27, fill: COL.chalk, anchor: 'middle', weight: 600 });
    T(p, '接收', { x: 1290, y: 510, size: 27, fill: COL.chalk, anchor: 'middle', weight: 600 });
    const packet = G(p, { x: 390, y: 500, o: 0 });
    mk('rect', { x: -58, y: -30, width: 116, height: 60, rx: 12, fill: COL.task }, packet);
    T(packet, '1500 B', { x: 0, y: 9, size: 24, fill: COL.board, anchor: 'middle', font: MATH, weight: 700 });
    show(packet, m('sub'), .3);
    prog(q => put(packet, { x: 390 + q * 820 }), m('sub') + .4, 4.2, io);
    text(p, '一个数据包，究竟在等什么？', 800, 690, m('sub') + .2, { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -18 }, D - .8, .7);
  }],

  ['packet', '先统一单位', (m) => {
    const p = panel(0);
    text(p, '1500 字节', 420, 250, m('bytes'), { size: 58, anchor: 'middle', weight: 700 });
    text(p, '× 8', 800, 250, m('bytes') + .7, { size: 48, fill: COL.task, anchor: 'middle', font: MATH, weight: 700 });
    text(p, '12 000 比特', 1180, 250, m('bits'), { size: 58, anchor: 'middle', weight: 700 });
    const arrow = path(p, 'M560 250H690', { stroke: COL.task, 'stroke-width': 5, fill: 'none' }, { d: 0 });
    draw(arrow, m('bytes') + .5, .6);
    const arrow2 = path(p, 'M910 250H1040', { stroke: COL.task, 'stroke-width': 5, fill: 'none' }, { d: 0 });
    draw(arrow2, m('bytes') + 1, .6);
    text(p, '1 字节 = 8 比特', 800, 400, m('bytes') + 1.2, { size: 32, fill: COL.dim, anchor: 'middle' });
    text(p, '8 块仅演示 1 字节的换算', 800, 590, m('bytes') + 1.5, { size: 28, fill: COL.dim, anchor: 'middle' });
    for (let i = 0; i < 8; i++) {
      const bit = mk('rect', { x: 560 + i * 70, y: 500, width: 48, height: 48, rx: 8, fill: COL.task, o: 0 }, p);
      show(bit, m('bytes') + 1.5 + i * .09, .25);
    }
    text(p, '先统一成比特，再除以速率', 800, 680, m('bits') + .8, { size: 34, fill: COL.chalk, anchor: 'middle', weight: 600 });
  }],

  ['rate', '链路能送多快', (m, D) => {
    const p = panel(0);
    text(p, '10 Mbps', 800, 230, m('rate'), { size: 76, fill: PROP_COLOR, anchor: 'middle', font: MATH, weight: 700 });
    text(p, '= 10 000 000 bit/s', 800, 330, m('rate') + .7, { size: 38, fill: COL.dim, anchor: 'middle', font: MATH });
    mk('line', { x1: 330, y1: 430, x2: 1270, y2: 430, stroke: COL.chalk, 'stroke-width': 8, 'stroke-linecap': 'round' }, p);
    const flow = G(p, { x: 360, y: 430, o: 0 });
    for (let i = 0; i < 6; i++) mk('circle', { cx: i * 120, cy: 0, r: 13, fill: PROP_COLOR }, flow);
    show(flow, m('rate') + .2, .3);
    prog(q => put(flow, { x: 360 + q * 560 }), m('rate') + .3, Math.min(5, D - m('rate') - 1), lin);
    text(p, '圆点只表示持续流动，不计数', 800, 495, m('rate') + 1, { size: 26, fill: COL.dim, anchor: 'middle' });
    text(p, '传输时延 = 数据包比特数 ÷ 链路速率', 800, 590, m('rate') + 1.2, { size: 38, anchor: 'middle', weight: 600 });
    text(p, '分子用比特，不用字节；分母用 bit/s', 800, 700, D - 4.2, { size: 30, fill: COL.dim, anchor: 'middle' });
  }],

  ['transmit', '把比特推上链路', (m) => {
    const p = panel(0);
    const net = S.net = networkLatency(p, 10, { title: '传输时延：把比特推上链路', part: 'transmission' });
    put(net.txValue, { o: 0 });
    net.txBar.setAttribute('width', '0');
    net.bitsNote.textContent = '示意：12 块 × 1000 bit；仅画入链，不按距离比例';
    net.bits.forEach((bit, i) => {
      bit.setAttribute('width', '14');
      bit.setAttribute('height', '30');
      bit.setAttribute('x', String(340 + i * 18));
      bit.setAttribute('y', '263');
    });
    const span = Math.max(1.2, m('done') - m('start'));
    net.bits.forEach((bit, i) => show(bit, m('start') + i * span / net.bits.length, .18));
    prog(q => net.txBar.setAttribute('width', (net.txWidth * q).toFixed(2)), m('start'), span, lin);
    show(net.txValue, m('done'), .35);
    text(p, '完成时：末 bit 刚入链，接收端仍为空', 800, 625, m('done') + .6, { size: 32, anchor: 'middle', weight: 700 });
    text(p, '发送完成，不等于已经到达', 800, 685, m('done') + 1, { size: 34, fill: COL.task, anchor: 'middle', weight: 700 });
  }],

  ['q1', '快速检查', () => {
    const p = panel(0);
    text(p, '10 Mbps · 12 000 bit', 800, 260, .2, { size: 52, anchor: 'middle', font: MATH, weight: 700 });
    text(p, '这段发送时间是多少？', 800, 370, .5, { size: 34, fill: COL.dim, anchor: 'middle' });
    text(p, '10 Mbps = 10 000 bit/ms', 800, 470, .8, { size: 30, fill: COL.dim, anchor: 'middle', font: MATH });
  }, { ask: done => quiz(BAND, [{
    id: 'c-transmit',
    prompt: ['10 Mbps 时，12 000 bit 的传输时延是多少？'],
    build: blanks([{
      parts: ['12 000 ÷ 10 000 = ', { box: '1.2' }, ' ms'],
      why: '10 Mbps = 10 000 bit/ms，所以 12 000 ÷ 10 000 = 1.2 ms。',
      hint: '先把 10 Mbps 换算成 10 000 bit/ms，再计算。',
    }]),
  }], done) }],

  ['propagate', '比特还要传播', (m) => {
    const p = panel(0);
    const net = S.net = networkLatency(p, 10, { title: '传播时延：比特走过链路', part: 'propagation' });
    show(net.propValue, .2, .4);
    show(net.pulse, m('pulse'), .2);
    prog(q => put(net.pulse, { x: 340 + q * 920 }), m('pulse') + .2, 2.6, io);
    text(p, '道路再宽，也不能让小车瞬间到达', 800, 630, m('pulse') + 3, { size: 34, fill: PROP_COLOR, anchor: 'middle', weight: 700 });
    text(p, '本例固定为 10 ms', 800, 700, m('pulse') + 3.6, { size: 30, fill: COL.dim, anchor: 'middle' });
  }],

  ['total', '两段等待相加', (m) => {
    const p = panel(0);
    const net = S.net = networkLatency(p, 10, { title: '简化总时延 = 传输 + 传播', part: 'full' });
    put(net.totalValue, { o: 0 });
    put(net.totalLabel, { o: 0 });
    put(net.propValue, { o: 0 });
    put(net.propLabel, { o: 0 });
    put(net.propBar, { o: 0 });
    show(net.txValue, .2, .4);
    show(net.txLabel, .2, .4);
    show(net.propValue, m('add'), .4);
    show(net.propLabel, m('add'), .4);
    show(net.propBar, m('add'), .4);
    show(net.totalValue, m('result'), .45);
    show(net.totalLabel, m('result'), .45);
    text(p, '不计排队、处理与协议开销', 800, 650, m('floor') + .2, { size: 24, fill: COL.dim, anchor: 'middle' });
    text(p, '总时延 ≥ 10 ms', 800, 710, m('floor'), { size: 38, fill: PROP_COLOR, anchor: 'middle', font: MATH, weight: 700 });
  }],

  ['lab', '亲手改变速率', () => {
    const p = panel(0);
    S.net = networkLatency(p, 10, { title: '一个滑块，三处联动', part: 'full', slider: true, compact: true });
  }, { ask: done => playgroundAsk(S.net, done) }],

  ['q2', '快速检查', () => {
    const p = panel(0);
    S.net = networkLatency(p, 10, { title: '把速率调到 20 Mbps', part: 'full', slider: true, compact: true });
  }, { ask: done => quiz(BAND, [{
    id: 'c-rate-state',
    prompt: ['把链路速率调到 20 Mbps，然后检查。'],
    build: rateTask(S.net, 20,
      '20 Mbps 时，传输时延是 0.6 ms，总时延是 10.6 ms。',
      rate => rate < 20 ? '还低了一些：继续提高速率，观察发送段变短。' : '调过头了：降低速率，回到 20 Mbps。'),
  }], done) }],

  ['wrap', '三点总结', (m) => {
    const p = panel(0);
    const rows = [
      ['速率改变发送时间', 'one', COL.task],
      ['传播取决于链路；本例固定 10 ms', 'two', PROP_COLOR],
      ['简化总时延是两段之和', 'three', COL.chalk],
    ];
    rows.forEach(([label, mark, colour], i) => {
      const y = 250 + i * 170;
      const g = G(p, { x: -20, o: 0 });
      mk('circle', { cx: 360, cy: y, r: 34, fill: colour }, g);
      T(g, String(i + 1), { x: 360, y: y + 12, size: 32, fill: COL.board, anchor: 'middle', weight: 700 });
      T(g, label, { x: 440, y: y + 12, size: 40, fill: COL.chalk, weight: 600 });
      tw(g, { x: 0, o: 1 }, m(mark), .55, out);
    });
  }],

  ['final1', '完整练习', () => {
    const p = panel(0);
    S.net = networkLatency(p, 1, { title: '', part: 'full', slider: true });
  }, { ask: done => {
    quiz(SCREEN, [{
      id: 'p-total-rate',
      prompt: ['调整速率，让简化总时延恰好等于 12.0 ms。'],
      build: rateTask(S.net, 6,
        '总时延 12 ms 减去传播 10 ms，发送时间为 2 ms；速率 = 12 000 bit ÷ 2 ms = 6000 bit/ms = 6 Mbps。',
        rate => rate < 6 ? '总时延仍高于 12 ms：继续提高速率。' : '总时延已低于 12 ms：把速率调低一些。'),
    }], done, '完整练习');
    document.querySelector('.card.screen.quiz').classList.add('rate-practice');
  } }],

  ['finish', '完成', () => { panel(0); }, { ask: finishCard }],
];

boot();
</script>
</body>
</html>
